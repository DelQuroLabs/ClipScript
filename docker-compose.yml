# Coolify: New Resource → your GitHub repo → Build Pack "Docker Compose".
# Coolify generates the encryption key (SERVICE_REALBASE64_64_…) and the web address (SERVICE_URL_…_3000) for you.
# Both are kept between deployments. NEVER change or delete APP_ENCRYPTION_KEY after the first deploy.
services:
  clipscript:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_URL_CLIPSCRIPT_3000
      - APP_ENCRYPTION_KEY=${SERVICE_REALBASE64_64_CLIPSCRIPT}
      - PUBLIC_ORIGIN=${SERVICE_URL_CLIPSCRIPT_3000}
      - REGISTRATION=${REGISTRATION:-first-user}
      - MONTHLY_TOKEN_CAP_PER_USER=${MONTHLY_TOKEN_CAP_PER_USER:-0}
      - NODE_ENV=production
      - COOKIE_SECURE=true
      - TRUST_PROXY=1
      - DATABASE_FILE=/data/clipscript.db
    volumes:
      - clipscript-data:/data
volumes:
  clipscript-data:
