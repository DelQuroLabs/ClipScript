# Coolify: New Resource → your GitHub repo → Build Pack "Docker Compose".
# Nothing to type except the domain (Configuration → General → Domains: https://your.domain:3000).
# APP_ENCRYPTION_KEY is optional: if empty, the app creates one on the /data volume and reuses it forever.
# If you ever DO set it, set it before saving any API keys, and never change it afterwards.
services:
  clipscript:
    build: .
    restart: unless-stopped
    environment:
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      - REGISTRATION=${REGISTRATION:-first-user}
      - MONTHLY_TOKEN_CAP_PER_USER=${MONTHLY_TOKEN_CAP_PER_USER:-0}
      - NODE_ENV=production
      - COOKIE_SECURE=true
      - TRUST_PROXY=1
      - DATABASE_FILE=/data/clipscript.db
    volumes:
      - clipscript-data:/data
volumes:
  clipscript-data:
